# Nginx for The Chefs Culinary Academy. setup-server.sh replaces __DOMAIN__; certbot then adds HTTPS.
# __DOMAIN__        → public website + student portal (apps/web), API under /api
# admin.__DOMAIN__  → admin app (apps/admin), API under /api

# Shared API proxy settings
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;
    root /opt/cca/apps/web/dist;
    index index.html;

    include /opt/cca/deploy/nginx/common.conf;
}

server {
    listen 80;
    server_name admin.__DOMAIN__;
    root /opt/cca/apps/admin/dist;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    include /opt/cca/deploy/nginx/common.conf;
}
