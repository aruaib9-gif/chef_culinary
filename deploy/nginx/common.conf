# Included by both sites in cca.conf.
client_max_body_size 6m; # uploads are capped at 5 MB by the API

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;
gzip_min_length 1024;

add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# API → Node on localhost:4000 (never exposed directly; the firewall blocks it)
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
}

# Built assets have hashed names, so they can be cached for a year.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# Single-page app: unknown paths load index.html (never cached, so new deploys show at once).
location / {
    try_files $uri $uri/ /index.html;
}
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
}
