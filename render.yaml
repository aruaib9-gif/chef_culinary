# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates: Node API, daily cron job, public website + student portal (static), admin app (static).
# The Postgres database already exists (cca-db, free plan, Frankfurt, id dpg-dbearalg1s2s73f0cd1g-a) and is not managed here.
# Frankfurt is the Render region with the lowest latency to Nigeria.

services:
  - type: web
    name: cca-api
    runtime: node
    region: frankfurt
    plan: starter # pre-deploy commands and zero-downtime deploys need a paid instance
    rootDir: .
    buildCommand: npm ci --workspace server --include-workspace-root
    # Runs migrations, then the idempotent seed (catalogue, grading scheme, first super admin).
    preDeployCommand: npm run release --workspace server
    startCommand: npm start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_URL
        sync: false # e.g. https://thechefsculinaryacademy.com (or https://cca-web.onrender.com)
      - key: ADMIN_URL
        sync: false # e.g. https://admin.thechefsculinaryacademy.com (or https://cca-admin.onrender.com)
      - key: PAYSTACK_SECRET_KEY
        sync: false # sk_live_… (or sk_test_… while testing); leave empty to disable online payments
      - key: SMTP_HOST
        sync: false # e.g. smtp.resend.com, smtp.sendgrid.net, smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false # e.g. The Chefs Culinary Academy <admissions@thechefsculinaryacademy.com>
      - key: ADMIN_NOTIFY_EMAILS
        sync: false # comma-separated; notified of new leads and applications
      - key: DATABASE_URL
        sync: false # cca-db → Connect → "Internal Database URL" (postgresql://chefs_academy:…@dpg-dbearalg1s2s73f0cd1g-a/chefs_academy)
      - key: SEED_ADMIN_EMAIL
        sync: false # first super admin; only used when no super admin exists yet
      - key: SEED_ADMIN_PASSWORD
        sync: false # at least 10 characters; must be changed at first sign-in

  - type: cron
    name: cca-daily-jobs
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 7 * * *" # 08:00 in Lagos — fee reminders, lead follow-ups, cleanup
    rootDir: .
    buildCommand: npm ci --workspace server --include-workspace-root
    startCommand: npm run jobs:daily --workspace server
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # the cron job doesn't verify sessions, so its own value is fine
      - key: WEB_URL
        sync: false # same value as on cca-api (used in email links)
      - key: SMTP_HOST
        sync: false # same SMTP settings as cca-api
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DATABASE_URL
        sync: false # cca-db → Connect → "Internal Database URL" (postgresql://chefs_academy:…@dpg-dbearalg1s2s73f0cd1g-a/chefs_academy)

  - type: web
    name: cca-web
    runtime: static
    rootDir: .
    buildCommand: npm ci --workspace @cca/web --include-workspace-root && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://cca-api.onrender.com (or https://api.thechefsculinaryacademy.com)
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: cca-admin
    runtime: static
    rootDir: .
    buildCommand: npm ci --workspace @cca/admin --include-workspace-root && npm run build:admin
    staticPublishPath: apps/admin/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
