# Netlify site for the public website + student portal.
# In Netlify: Base directory = (leave empty, repo root), Package directory = apps/web.
# Paths below are relative to the repo root; the build runs there (npm workspaces).
[build]
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # Set VITE_API_URL in the Netlify UI (Site configuration → Environment variables),
  # e.g. https://cca-api.onrender.com — it is baked in at build time.

# Single-page app routing lives in apps/web/public/_redirects (copied into the build).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
